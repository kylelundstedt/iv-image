name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Apex
        run: |
          version=$(sed -nE 's/^APEX_VERSION=//p' provision-iv.sh)
          sha=$(sed -nE 's/^APEX_SHA256_AMD64=//p' provision-iv.sh)
          archive="$RUNNER_TEMP/apex.tar.gz"
          curl -fsSL "https://github.com/ApexMarkdown/apex/releases/download/v${version}/apex-${version}-linux-x86_64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$sha" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/apex-${version}-linux-x86_64/apex" /usr/local/bin/apex
          apex --version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Check shell syntax
        run: |
          while IFS= read -r file; do bash -n "$file"; done < <(
            find . -path ./.git -prune -o -type f -name '*.sh' -print
          )

      - name: Check JSON
        run: |
          jq empty agent/settings.json
          jq empty agent/mcp-servers.json
          jq empty .claude/settings.json

      - name: Lint Python
        run: uvx --from ruff==0.15.12 ruff check bin/gen-llms-txt bin/render-md-site bin/shot tests/test_gen_llms_txt.py tests/test_render_md_site.py

      - name: Check maintained Python formatting
        run: uvx --from ruff==0.15.12 ruff format --check bin/gen-llms-txt bin/render-md-site tests/test_gen_llms_txt.py tests/test_render_md_site.py

      - name: Run tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          tests/test-provision.sh
          tests/test-agentsview-source.sh
          tests/test-ssh-guard.sh

      - name: Render documentation with Apex
        run: |
          bin/render-site .
          test -f _site/llms.txt
          test -f _site/llms-full.txt
          test -f _site/bootstrap.md
          test ! -f _site/TODO.html
